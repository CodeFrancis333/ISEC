name: Public wind map checks
on:
  pull_request:
    paths: ['isec-website/**', 'wind-map/shared/**', '.github/workflows/wind-map.yml']
  push:
    branches: [main]
    paths: ['isec-website/**', 'wind-map/shared/**', '.github/workflows/wind-map.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: isec-website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: isec-website/package-lock.json
      - run: npm ci
      - run: npm run typecheck:wind
      - run: npm run lint:wind
      - run: npm run test:wind
      - run: npm run validate:wind
      - run: npm run build
